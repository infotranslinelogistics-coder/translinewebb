[build]
  command = "npm install && cd portal && npm install && cd .. && npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Portal SPA routing
# Note: force = false allows static files to be served first
[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200
  force = false

# Unknown marketing paths return the actual 404 page. Generated pages resolve as files.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
